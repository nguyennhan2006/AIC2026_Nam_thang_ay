[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-video-retrieval-v1"
version = "1.0.0"
description = "Integrated data, offline and online video retrieval system"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
faiss = ["numpy>=1.26,<3", "faiss-cpu>=1.8,<2"]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
gpu = ["torch>=2.3,<3", "transformers>=4.49,<5", "accelerate>=0.34,<2", "pillow>=10,<12", "qwen-vl-utils>=0.0.8,<1", "numpy>=1.26,<3"]
# scripts/caption_qwen3vl.py: Qwen3-VL-32B captioning qua OpenRouter (khong can GPU thue)
# hoac vLLM tu host. Tu chua (khong phu thuoc extra "gpu") de cai duoc doc lap.
caption-qwen3vl = ["requests>=2.31,<3", "opencv-python-headless>=4.9,<5", "tqdm>=4.66,<5", "huggingface-hub>=0.24,<1", "transformers>=4.49,<5", "torch>=2.3,<3", "pillow>=10,<12", "numpy>=1.26,<3"]
# Model target theo docs/11_SERVER_IMPLEMENTATION.md/13 CHƯA có code tích hợp (chờ GPU thật
# để viết+test) — khai báo sẵn dependency để lúc thuê máy chỉ "pip install" là xong, không
# mất thời gian debug dependency giữa lúc gấp. Xem docs/14_TECHNICAL_PREPARATION.md.
gpu-target = ["open_clip_torch>=2.24,<3", "ultralytics>=8.2,<9", "whisperx>=3.1,<4"]
all = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "numpy>=1.26,<3", "httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
aic-data-validate = "datasection.cli:main"
aic-offline = "offline.cli:main"
aic-online = "online.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datasection*", "offline*", "online*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
