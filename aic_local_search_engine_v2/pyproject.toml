[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-local-search"
version = "0.2.0"
description = "Local multi-branch video retrieval engine for AIC 2026"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
visual = ["open_clip_torch"]
dev = ["pytest>=8"]

[project.scripts]
aic-local-search = "aic_local_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
